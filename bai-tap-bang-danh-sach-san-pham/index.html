<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; }
        h1 { color: #225b91; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; }
        th, td { border: 1px solid #777; padding: 12px; text-align: left; }
        th { background-color: #dcecff; }
        tr:nth-child(even) { background-color: #f7f9fc; }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr><td>Áo thun</td><td>150.000 VNĐ</td><td>20</td></tr>
        <tr><td>Quần jeans</td><td>350.000 VNĐ</td><td>15</td></tr>
        <tr><td>Giày thể thao</td><td>600.000 VNĐ</td><td>10</td></tr>
        <tr><td>Balo</td><td>250.000 VNĐ</td><td>12</td></tr>
    </table>
</body>
</html>
