<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tìm kiếm</title>
</head>
<body>
    <h1>Tìm kiếm trên Google</h1>
    <form action="https://www.google.com.vn/search" method="GET">
        <label for="q">Từ khóa tìm kiếm:</label>
        <input type="text" id="q" name="q" placeholder="Nhập từ khóa" required>
        <input type="submit" value="Tìm kiếm">
    </form>
</body>
</html>
