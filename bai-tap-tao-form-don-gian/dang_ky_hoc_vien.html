<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Phần 2 - Đăng ký học viên</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><nav class="nav"><a href="index.html">← Xem Phần 1: Sở thích của bạn</a></nav><section class="card"><h1 class="banner blue">ĐĂNG KÝ HỌC VIÊN</h1><form class="inner" action="" method="get"><div class="row"><div class="field"><label for="fullname">Họ và tên <span class="required">*</span></label><input id="fullname" type="text" name="fullname" required></div><div class="field"><label for="email">Email <span class="required">*</span></label><input id="email" type="email" name="email" required></div><div class="field"><label for="phone">Số điện thoại</label><input id="phone" type="tel" name="phone" placeholder="Nhập số điện thoại"></div><div class="field"><label for="birthday">Ngày sinh</label><input id="birthday" type="date" name="birthday"></div></div><div class="field"><strong>Giới tính</strong><div class="choices"><label><input type="radio" name="gender" value="nam"> Nam</label><label><input type="radio" name="gender" value="nu"> Nữ</label><label><input type="radio" name="gender" value="khac"> Khác</label></div></div><div class="field"><label for="address">Địa chỉ</label><textarea id="address" name="address" rows="2"></textarea></div><div class="field"><label for="course">Khóa học</label><select id="course" name="course"><option value="html_css">HTML &amp; CSS</option><option value="javascript">JavaScript</option><option value="java">Java</option><option value="python">Python</option></select></div><div class="field"><strong>Hình thức học</strong><div class="choices"><label><input type="radio" name="study_type" value="online"> Online</label><label><input type="radio" name="study_type" value="offline"> Offline</label></div></div><div class="field"><strong>Sở thích</strong><div class="choices"><label><input type="checkbox" name="hobby" value="lap_trinh"> Lập trình</label><label><input type="checkbox" name="hobby" value="doc_sach"> Đọc sách</label><label><input type="checkbox" name="hobby" value="am_nhac"> Âm nhạc</label><label><input type="checkbox" name="hobby" value="the_thao"> Thể thao</label></div></div><div class="field"><label for="note">Ghi chú</label><textarea id="note" name="note" rows="3" placeholder="Ghi chú thêm (nếu có)"></textarea></div><div class="actions"><button type="submit">Đăng ký</button><button type="reset">Nhập lại</button></div><p class="hint">Form thực hành HTML: phương thức GET, chưa kết nối hệ thống lưu thông tin.</p></form></section></main></body></html>
